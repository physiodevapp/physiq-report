name: Deploy to PhysiQ hub

on:
  push:
    branches: [main]

concurrency:
  group: physiq-hub-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout physiq-report
        uses: actions/checkout@v4

      - name: Checkout physiq hub
        uses: actions/checkout@v4
        with:
          repository: physiodevapp/physiq
          token: ${{ secrets.PHYSIQ_DEPLOY_TOKEN }}
          path: physiq-hub

      - name: Copy files to hub
        run: |
          rm -rf physiq-hub/report
          mkdir -p physiq-hub/report/lib physiq-hub/report/icons
          cp index.html app.js sw.js manifest.json favicon.svg physiq-hub/report/
          cp icons/icon-192.png icons/icon-512.png physiq-hub/report/icons/
          cp lib/session.js lib/payload.js physiq-hub/report/lib/

      - name: Commit and push
        working-directory: physiq-hub
        env:
          PHYSIQ_DEPLOY_TOKEN: ${{ secrets.PHYSIQ_DEPLOY_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A report/
          git diff --cached --quiet && exit 0
          git commit -m "chore: update report from physiq-report@${{ github.sha }}"
          git remote set-url origin https://x-access-token:${PHYSIQ_DEPLOY_TOKEN}@github.com/physiodevapp/physiq.git
          for i in 1 2 4 8; do
            git push origin main && break
            echo "Push rejected, pulling and retrying in ${i}s..."
            sleep $i
            git pull --rebase origin main
          done
